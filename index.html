<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Night Freeway</title>
<style>
/* Layout: full-screen canvas with a small speedometer and controls at bottom left. Single dark theme for the night scene. */
:root {
  --bg: #02030a;
  --ink: #d9dcf0;
  --dim: #7d8199;
  --amber: #ffb35a;
  --panel: rgba(10, 12, 26, 0.62);
  --line: rgba(160, 170, 220, 0.22);
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --sans: "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; }
body { font-family: var(--sans); }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: var(--bg); }

.hud {
  position: fixed;
  left: calc(14px + env(safe-area-inset-left, 0px));
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  max-width: calc(100vw - 28px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
  padding: 8px 10px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  transition: opacity .6s;
}
.hud.idle { opacity: 0.25; }
.hud:hover { opacity: 1; }
.speed { font-family: var(--mono); font-variant-numeric: tabular-nums; min-width: 7.5ch; text-align: right;
         touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
.speed b { font-size: 22px; font-weight: 500; color: var(--amber); }
.speed span { font-size: 11px; color: var(--dim); letter-spacing: .08em; margin-left: 4px; }
.hud button {
  font: 500 16px var(--mono);
  width: 36px; height: 36px;
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 8px;
  cursor: pointer;
  touch-action: manipulation;
}
.hud button:hover { border-color: var(--amber); color: var(--amber); }
.hud button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.hud button.drive { width: auto; padding: 0 12px; font: 500 13px var(--sans); }
.keys { font-size: 11px; color: var(--dim); letter-spacing: .04em; }
@media (max-width: 520px) { .keys { display: none; } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&display=swap">
</head>
<body>
<canvas id="scene" aria-label="光る点で描いた夜の高速道路を走る映像"></canvas>

<div class="hud" id="hud">
  <button id="slower" type="button" aria-label="減速">−</button>
  <div class="speed" aria-live="off"><b id="kmh">101</b><span>km/h</span></div>
  <button id="faster" type="button" aria-label="加速">＋</button>
  <button id="pause" type="button" aria-label="一時停止">Ⅱ</button>
  <button id="drive" class="drive" type="button" aria-label="通行方向を切り替え">左側通行</button>
  <button id="fs" type="button" aria-label="全画面">⛶</button>
  <div class="keys" id="keys">↑↓ 速度 ・ Space 停止 ・ D 通行方向 ・ F 全画面</div>
</div>

<script>
(() => {
  // ---------------- UI language (follows the browser's language settings) ----------------
  const STRINGS = {
    ja: { title: 'Night Freeway', scene: '光る点で描いた夜の高速道路を走る映像',
          slower: '減速', faster: '加速', pause: '一時停止', resume: '再開',
          left: '左側通行', right: '右側通行', drive: '通行方向を切り替え',
          fs: '全画面', fsExit: '全画面を解除',
          keys: '↑↓ 速度 ・ Space 停止 ・ D 通行方向 ・ F 全画面' },
    en: { title: 'Night Freeway', scene: 'A night drive on the freeway, drawn with points of light',
          slower: 'Slow down', faster: 'Speed up', pause: 'Pause', resume: 'Resume',
          left: 'Left-hand traffic', right: 'Right-hand traffic', drive: 'Switch driving side',
          fs: 'Fullscreen', fsExit: 'Exit fullscreen',
          keys: '↑↓ speed · Space pause · D driving side · F fullscreen' },
    zh: { title: 'Night Freeway', scene: '用光点描绘的夜间高速公路驾驶场景',
          slower: '减速', faster: '加速', pause: '暂停', resume: '继续',
          left: '靠左行驶', right: '靠右行驶', drive: '切换行驶方向',
          fs: '全屏', fsExit: '退出全屏',
          keys: '↑↓ 速度 · 空格 暂停 · D 行驶方向 · F 全屏' },
    ko: { title: 'Night Freeway', scene: '빛나는 점으로 그린 밤 고속도로 주행 장면',
          slower: '감속', faster: '가속', pause: '일시 정지', resume: '재개',
          left: '좌측통행', right: '우측통행', drive: '통행 방향 전환',
          fs: '전체 화면', fsExit: '전체 화면 종료',
          keys: '↑↓ 속도 · Space 일시 정지 · D 통행 방향 · F 전체 화면' },
    fr: { title: 'Night Freeway', scene: 'Un trajet de nuit sur l’autoroute, dessiné avec des points lumineux',
          slower: 'Ralentir', faster: 'Accélérer', pause: 'Pause', resume: 'Reprendre',
          left: 'Circulation à gauche', right: 'Circulation à droite', drive: 'Changer le sens de circulation',
          fs: 'Plein écran', fsExit: 'Quitter le plein écran',
          keys: '↑↓ vitesse · Espace pause · D sens de circulation · F plein écran' },
    de: { title: 'Night Freeway', scene: 'Eine nächtliche Autobahnfahrt aus Lichtpunkten',
          slower: 'Langsamer', faster: 'Schneller', pause: 'Pause', resume: 'Fortsetzen',
          left: 'Linksverkehr', right: 'Rechtsverkehr', drive: 'Fahrseite wechseln',
          fs: 'Vollbild', fsExit: 'Vollbild beenden',
          keys: '↑↓ Tempo · Leertaste Pause · D Fahrseite · F Vollbild' },
    es: { title: 'Night Freeway', scene: 'Un viaje nocturno por la autopista dibujado con puntos de luz',
          slower: 'Reducir velocidad', faster: 'Acelerar', pause: 'Pausa', resume: 'Reanudar',
          left: 'Circulación por la izquierda', right: 'Circulación por la derecha', drive: 'Cambiar el lado de circulación',
          fs: 'Pantalla completa', fsExit: 'Salir de pantalla completa',
          keys: '↑↓ velocidad · Espacio pausa · D lado de circulación · F pantalla completa' },
  };
  // pick the first supported language from the browser's preference list; fall back to English
  const LANG = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'])
    .map(l => String(l).toLowerCase().split('-')[0])
    .find(l => STRINGS[l]) || 'en';
  const T = STRINGS[LANG];
  document.documentElement.lang = LANG;
  document.title = T.title;
  document.getElementById('scene').setAttribute('aria-label', T.scene);
  document.getElementById('slower').setAttribute('aria-label', T.slower);
  document.getElementById('faster').setAttribute('aria-label', T.faster);
  document.getElementById('pause').setAttribute('aria-label', T.pause);
  document.getElementById('drive').setAttribute('aria-label', T.drive);
  document.getElementById('fs').setAttribute('aria-label', T.fs);
  document.getElementById('drive').textContent = T.left;
  document.getElementById('keys').textContent = T.keys;
  // ---------------- Screen ----------------
  const cv = document.getElementById('scene');
  const ctx = cv.getContext('2d');
  let SW = 0, SH = 0, CX = 0, CY = 0, FOCAL = 960, WRAP = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    SW = window.innerWidth; SH = window.innerHeight;
    cv.width = Math.round(SW * DPR); cv.height = Math.round(SH * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    CX = SW / 2; CY = SH / 2;
    FOCAL = Math.max(SW / 2, SH * 0.55);   // equivalent to 960 (half the width) in the original code
    WRAP = 2 * Math.PI * FOCAL;             // background width covering 360 degrees
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------------- Camera & road ----------------
  const CAM_X = -1.75;   // left lane (Japan drives on the left)
  const CAM_H = 1.2;
  const MAXD = 600;
  const offX = new Float64Array(MAXD + 2);
  const offY = new Float64Array(MAXD + 2);
  let trackS = 1000, speed = 28, heading = 0;
  let side = 1, sideTarget = 1;   // +1 = left-hand traffic, -1 = right-hand (eased for a smooth flip)

  // ---------------- Position-based pseudo-random numbers ----------------
  function hash32(x) {
    x = x >>> 0;
    x ^= x >>> 16; x = Math.imul(x, 0x7feb352d);
    x ^= x >>> 15; x = Math.imul(x, 0x846ca68b);
    x ^= x >>> 16;
    return x >>> 0;
  }
  const rnd = (n, salt) =>
    (hash32(Math.imul(n | 0, 2654435761) ^ Math.imul(salt, 0x9E3779B9)) & 0xFFFFFF) / 16777216;
  const smooth = t => t * t * (3 - 2 * t);
  const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
  const fade = (d, range) => clamp01(1 - d / range);
  const rand = n => Math.floor(Math.random() * (n + 1));   // equivalent to DxLib's GetRand(n)

  // ---------------- Road shape ----------------
  function curvTarget(idx) {
    if (rnd(idx, 1) < 0.35) return 0;
    const mag = 0.0010 + rnd(idx, 2) * 0.0030;
    return rnd(idx, 3) < 0.5 ? -mag : mag;
  }
  function curvature(s) {
    const SEG = 300, idx = Math.floor(s / SEG), t = (s - idx * SEG) / SEG;
    const u = t < 0.35 ? smooth(t / 0.35) : 1;
    return curvTarget(idx - 1) * (1 - u) + curvTarget(idx) * u;
  }
  function slopeTarget(idx) {
    if (rnd(idx, 11) < 0.5) return 0;
    const mag = 0.00004 + rnd(idx, 12) * 0.00012;
    return rnd(idx, 13) < 0.5 ? -mag : mag;
  }
  function vcurvature(s) {
    const SEG = 450, idx = Math.floor(s / SEG), t = (s - idx * SEG) / SEG;
    const u = t < 0.4 ? smooth(t / 0.4) : 1;
    return slopeTarget(idx - 1) * (1 - u) + slopeTarget(idx) * u;
  }
  function updateRoadShape() {
    let ang = 0, pang = 0;
    offX[0] = 0; offY[0] = 0;
    for (let i = 0; i <= MAXD; i++) {
      ang += curvature(trackS + i);
      pang += vcurvature(trackS + i);
      offX[i + 1] = offX[i] + ang;
      offY[i + 1] = offY[i] + pang;
    }
  }

  // point d m ahead, lateral offset lat m, height h m -> screen coordinates
  const P = { x: 0, y: 0, sc: 0 };
  function project(d, lat, h) {
    if (d < 1 || d >= MAXD) return false;
    const i = d | 0, f = d - i;
    const ox = offX[i] * (1 - f) + offX[i + 1] * f;
    const oy = offY[i] * (1 - f) + offY[i + 1] * f;
    P.sc = FOCAL / d;
    // mirror the road layout sideways for right-hand traffic
    P.x = CX + (side * (lat - CAM_X) + ox) * P.sc;
    P.y = CY - (h + oy - CAM_H) * P.sc;
    return true;
  }

  // ---------------- Light sprites (created once per color) ----------------
  const sprites = new Map();
  function sprite(r, g, b) {
    const key = r + ',' + g + ',' + b;
    let s = sprites.get(key);
    if (s) return s;
    const N = 128;
    s = document.createElement('canvas'); s.width = s.height = N;
    const c = s.getContext('2d');
    const gr = c.createRadialGradient(N / 2, N / 2, 0, N / 2, N / 2, N / 2);
    const cr = r + (255 - r) * 0.7 | 0, cg = g + (255 - g) * 0.7 | 0, cb = b + (255 - b) * 0.7 | 0;
    gr.addColorStop(0.00, `rgba(${cr},${cg},${cb},1)`);
    gr.addColorStop(0.10, `rgba(${r},${g},${b},0.95)`);
    gr.addColorStop(0.22, `rgba(${r},${g},${b},0.40)`);
    gr.addColorStop(0.50, `rgba(${r},${g},${b},0.10)`);
    gr.addColorStop(1.00, `rgba(${r},${g},${b},0)`);
    c.fillStyle = gr; c.fillRect(0, 0, N, N);
    sprites.set(key, s);
    return s;
  }

  // r = core radius (px); the halo extends to about 4.5x the core
  function glow(x, y, r, col, a) {
    if (a <= 0.003) return;
    if (r < 0.7) { const k = r / 0.7; a *= k < 0.3 ? 0.3 : k; r = 0.7; }
    if (a > 1) a = 1;
    const half = r * 4.5;
    if (x + half < 0 || x - half > SW || y + half < 0 || y - half > SH) return;
    ctx.globalAlpha = a;
    ctx.drawImage(col, x - half, y - half, half * 2, half * 2);
  }

  const C = {
    star:   sprite(200, 200, 255),
    white:  sprite(230, 230, 240),
    refW:   sprite(210, 220, 255),
    refO:   sprite(255, 150, 40),
    lamp:   sprite(255, 170, 70),
    tail:   sprite(255, 35, 20),
    head:   sprite(255, 245, 215),
    cityY:  sprite(255, 210, 140),
    red:    sprite(255, 30, 20),
    ufoC:   sprite(90, 255, 220),
    ufoM:   sprite(255, 80, 210),
    ufoG:   sprite(150, 255, 90),
  };

  // ---------------- Background (stars & city lights) ----------------
  const stars = [], city = [];
  function initBackground() {
    stars.length = 0; city.length = 0;
    const W = Math.ceil(WRAP);
    for (let i = 0; i < 1400; i++) {
      stars.push({ x: rand(W - 1), yr: Math.random() * 0.83, b: 50 + rand(170),
                   ph: Math.random() * 6.28, big: rand(99) < 3 });
    }
    const pal = [[255, 200, 100], [255, 150, 60], [220, 230, 255]];
    for (let i = 0; i < 900; i++) {
      const r = Math.random(), t = rand(99);
      city.push({ x: rand(W - 1), dy: 3 + r * r * 38, ph: Math.random() * 1.5, b: 70 + rand(150),
                  kind: t < 92 ? 0 : t < 97 ? 1 : 2,
                  col: t < 45 ? pal[0] : t < 70 ? pal[1] : pal[2] });
    }
  }
  initBackground();

  function scrollX(x, wrap) {
    let sx = (x - heading * FOCAL) % wrap;
    if (sx < 0) sx += wrap;
    return sx;
  }

  function drawSkyGlow() {
    const g = ctx.createLinearGradient(0, CY - 170, 0, CY + 24);
    g.addColorStop(0, 'rgba(255,130,60,0)');
    g.addColorStop(0.82, 'rgba(255,130,60,0.14)');
    g.addColorStop(1, 'rgba(255,130,60,0)');
    ctx.globalAlpha = 1;
    ctx.fillStyle = g;
    ctx.fillRect(0, CY - 170, SW, 194);
  }

  function drawStars(time) {
    const W = Math.ceil(WRAP), skyH = CY - 70;
    for (const s of stars) {
      const sx = scrollX(s.x, W);
      if (sx >= SW) continue;
      const sy = s.yr * skyH;
      const tw = 0.75 + 0.25 * Math.sin(time * 2.3 + s.ph);
      if (s.big) { glow(sx, sy, 1.0, C.star, 0.6 * tw); continue; }
      const c = s.b * tw | 0;
      ctx.globalAlpha = 1;
      ctx.fillStyle = `rgb(${c * 0.75 | 0},${c * 0.75 | 0},${c})`;
      ctx.fillRect(sx | 0, sy | 0, 1, 1);
    }
  }

  function drawCity(time) {
    const W = Math.ceil(WRAP);
    for (const L of city) {
      const sx = scrollX(L.x, W);
      if (sx >= SW) continue;
      const y = CY - L.dy;
      if (L.kind === 2) {
        if ((time + L.ph) % 1.5 < 0.2) glow(sx, y, 1.3, C.red, 0.9);
      } else if (L.kind === 1) {
        glow(sx, y, 0.9, C.cityY, 0.5);
      } else {
        ctx.globalAlpha = L.b / 255;
        ctx.fillStyle = `rgb(${L.col[0]},${L.col[1]},${L.col[2]})`;
        ctx.fillRect(sx | 0, y | 0, 1, 1);
      }
    }
  }

  // ---------------- Shooting stars ----------------
  const meteors = [];
  let nextMeteor = 8 + Math.random() * 10;
  function spawnMeteor() {
    // positions live in background coordinates, so meteors scroll with the stars on curves
    const k = FOCAL / 960;
    const dir = Math.random() < 0.5 ? -1 : 1;
    const ang = (20 + Math.random() * 30) * Math.PI / 180;
    const v = (700 + Math.random() * 600) * k;
    meteors.push({
      x: heading * FOCAL + SW * (0.1 + Math.random() * 0.8),
      y: CY * (0.05 + Math.random() * 0.45),
      vx: Math.cos(ang) * v * dir, vy: Math.sin(ang) * v,
      len: (90 + Math.random() * 120) * k,
      life: 0, max: 0.5 + Math.random() * 0.7,
      bright: Math.random() < 0.2 ? 1.0 : 0.7,
    });
  }
  function updateMeteors(dt) {
    nextMeteor -= dt;
    if (nextMeteor <= 0) { spawnMeteor(); nextMeteor = 15 + Math.random() * 30; }  // one every 15-45 seconds
    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i];
      m.life += dt; m.x += m.vx * dt; m.y += m.vy * dt;
      if (m.life >= m.max || m.y > CY - 40) meteors.splice(i, 1);
    }
  }
  function drawMeteors() {
    const W = Math.ceil(WRAP);
    for (const m of meteors) {
      const hx = scrollX(m.x, W), hy = m.y;
      if (hx > SW + m.len) continue;
      const a = Math.sin(Math.PI * m.life / m.max) * m.bright;  // fades in and out over its short life
      const sp = Math.hypot(m.vx, m.vy);
      const tx = hx - m.vx / sp * m.len, ty = hy - m.vy / sp * m.len;
      const g = ctx.createLinearGradient(tx, ty, hx, hy);
      g.addColorStop(0, 'rgba(190,205,255,0)');
      g.addColorStop(1, 'rgba(240,245,255,0.9)');
      ctx.globalAlpha = a;
      ctx.strokeStyle = g;
      ctx.lineWidth = 1.6;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(hx, hy); ctx.stroke();
      glow(hx, hy, 1.1, C.star, a);
    }
  }

  // ---------------- Easter egg: a UFO made of lights (summoned by the Konami code) ----------------
  const UFO_T = 12.2;   // total screen time in seconds
  let ufo = null;
  function summonUfo() {
    ufo = {
      t: 0,
      dir: Math.random() < 0.5 ? 1 : -1,        // +1 = flies in from the left
      exitDir: Math.random() < 0.5 ? 1 : -1,
      hx: SW * (0.38 + Math.random() * 0.24),   // hover position
      drift: 0, lastHeading: heading,
    };
  }
  function updateUfo(dt) {
    if (!ufo) return;
    ufo.t += dt;
    // lag behind on curves like the background, then catch up with the car
    ufo.drift = (ufo.drift - (heading - ufo.lastHeading) * FOCAL) * Math.exp(-dt * 0.8);
    ufo.lastHeading = heading;
    if (ufo.t > UFO_T) ufo = null;
  }
  function drawUfo() {
    if (!ufo) return;
    const t = ufo.t, k = FOCAL / 960, hy = CY * 0.36;
    let x, y, tilt, s = 1, a = 1;
    if (t < 3) {                                   // arrive, leaning into the motion
      const x0 = ufo.dir > 0 ? -160 * k : SW + 160 * k;
      const p = smooth(t / 3);
      x = x0 + (ufo.hx - x0) * p;
      y = CY * 0.12 + (hy - CY * 0.12) * p;
      tilt = ufo.dir * 0.28 * (1 - p);
      a = clamp01(t / 0.6);
    } else {                                       // hover and wobble
      const h = t - 3;
      x = ufo.hx + Math.sin(h * 0.7) * 14 * k;
      y = hy + Math.sin(h * 1.7) * 6 * k;
      tilt = Math.sin(h * 1.3) * 0.06;
      if (t > 11) {                                // zip away into the sky
        const q = (t - 11) / (UFO_T - 11), q2 = q * q;
        x += ufo.exitDir * q2 * SW * 0.9;
        y -= q2 * CY * 0.8;
        tilt += ufo.exitDir * 0.35 * q;
        s = 1 - 0.65 * q;
        a = 1 - q2;
      }
    }
    x += ufo.drift;
    const R = 74 * k * s, dot = 2.3 * k * s;
    const cs = Math.cos(tilt), sn = Math.sin(tilt);
    const pt = (lx, ly) => { P.x = x + lx * cs - ly * sn; P.y = y + lx * sn + ly * cs; };

    // tractor beam down to the horizon, with sparkles drifting up
    const beam = clamp01((t - 4.5) / 0.6) * clamp01((9.5 - t) / 0.6) * a;
    const top = y + R * 0.2, bot = CY - 4;
    if (beam > 0 && bot > top) {
      const g = ctx.createLinearGradient(0, top, 0, bot);
      g.addColorStop(0, 'rgba(120,255,225,0.20)');
      g.addColorStop(1, 'rgba(120,255,225,0.03)');
      ctx.globalAlpha = beam;
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(x - R * 0.3, top); ctx.lineTo(x + R * 0.3, top);
      ctx.lineTo(x + R * 0.95, bot); ctx.lineTo(x - R * 0.95, bot);
      ctx.closePath(); ctx.fill();
      for (let i = 0; i < 28; i++) {
        const f = (rnd(i, 21) + t * (0.25 + rnd(i, 22) * 0.3)) % 1;   // 0 = ground, 1 = saucer
        const w = R * (0.3 + 0.65 * (1 - f));
        glow(x + (rnd(i, 23) * 2 - 1) * w * 0.85, bot - f * (bot - top),
             0.9, C.ufoC, beam * 0.8 * Math.sin(Math.PI * f));
      }
    }

    // faint glow under the hull
    pt(0, R * 0.12); glow(P.x, P.y, R * 0.12, C.ufoC, 0.18 * a);

    // upper hull outline (dim white points)
    for (let i = 0; i < 26; i++) {
      const th = i / 26 * Math.PI * 2;
      pt(Math.cos(th) * R * 0.8, -R * 0.07 + Math.sin(th) * R * 0.17);
      glow(P.x, P.y, dot * 0.55, C.white, (Math.sin(th) > 0 ? 0.45 : 0.2) * a);
    }

    // dome: rows of dim cyan points, with a blinking beacon on top
    for (const [sc, n] of [[1, 13], [0.72, 9], [0.42, 5]]) {
      for (let i = 0; i <= n; i++) {
        const th = Math.PI + i / n * Math.PI;
        pt(Math.cos(th) * R * 0.4 * sc, -R * 0.12 + Math.sin(th) * R * 0.36 * sc);
        glow(P.x, P.y, dot * 0.6, C.ufoC, 0.35 * a);
      }
    }
    pt(0, -R * 0.52);
    if (t % 1.0 < 0.5) glow(P.x, P.y, dot * 1.1, C.red, 0.9 * a);

    // rotating rim lights with a chasing highlight
    const N = 18, chase = Math.floor(t * 9);
    const cols = [C.ufoC, C.ufoM, C.ufoG];
    for (let i = 0; i < N; i++) {
      const th = i / N * Math.PI * 2 + t * 1.8;
      pt(Math.cos(th) * R, Math.sin(th) * R * 0.26);
      const front = Math.sin(th) > -0.1 ? 1 : 0.35;   // far side of the rim is dimmer
      const hot = (i + chase) % 6 === 0;
      glow(P.x, P.y, dot * (hot ? 1.5 : 1), cols[i % 3], (hot ? 1 : 0.7) * front * a);
    }

    // pulsing lights on the underside
    for (let i = 0; i < 3; i++) {
      const th = i / 3 * Math.PI * 2 - t * 1.2;
      pt(Math.cos(th) * R * 0.38, R * 0.15 + Math.sin(th) * R * 0.08);
      glow(P.x, P.y, dot * 1.2, C.ufoM, (0.5 + 0.4 * Math.sin(t * 6 + i * 2.1)) * a);
    }
  }

  // ---------------- Road lights ----------------
  function drawRow(spacing, onCount, cycle, lat, h, rad, col, inten, range) {
    for (let n = Math.ceil((trackS + 1) / spacing); ; n++) {
      const d = n * spacing - trackS;
      if (d > range || d >= MAXD) break;
      if (cycle > 0 && (((n % cycle) + cycle) % cycle) >= onCount) continue;
      if (!project(d, lat, h)) continue;
      glow(P.x, P.y, rad * P.sc, col, inten * fade(d, range));
    }
  }

  function groundPool(d, lat, radius, rgb, a) {
    if (a <= 0.004 || !project(d, lat, 0)) return;
    const rx = radius * P.sc;
    const ry = Math.max(1, rx * CAM_H / d);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
    g.addColorStop(0, `rgba(${rgb},1)`);
    g.addColorStop(1, `rgba(${rgb},0)`);
    ctx.save();
    ctx.translate(P.x, P.y);
    ctx.scale(rx, ry);
    ctx.globalAlpha = a;
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, 1, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawRoad() {
    // road surface lit by our own headlights
    groundPool(14, CAM_X, 5, '255,240,200', 0.07);
    groundPool(32, CAM_X, 7, '255,240,200', 0.04);

    // light pools under the street lamps
    const LAMP = 45;
    for (let n = Math.ceil((trackS + 3) / LAMP); ; n++) {
      const d = n * LAMP - trackS;
      if (d >= MAXD) break;
      const a = 0.10 * fade(d, 350);
      groundPool(d, 2.0, 8, '255,150,60', a);
      groundPool(d, 7.0, 8, '255,150,60', a);
    }

    drawRow(3, 3, 7, 0.0, 0.02, 0.06, C.white, 0.55, 150);   // dashed lane divider
    drawRow(3, 0, 0, -3.5, 0.02, 0.05, C.white, 0.35, 110);  // edge lines
    drawRow(3, 0, 0, 3.5, 0.02, 0.05, C.white, 0.30, 110);
    drawRow(3, 3, 7, 9.0, 0.02, 0.06, C.white, 0.15, 80);    // dashed divider on the oncoming carriageway

    drawRow(12, 0, 0, -4.0, 0.9, 0.06, C.refW, 0.9, 420);    // delineators: left side = white
    drawRow(12, 0, 0, 3.9, 0.9, 0.06, C.refO, 0.9, 420);     // median side = orange
    drawRow(12, 0, 0, 5.1, 0.9, 0.05, C.refO, 0.2, 250);
    drawRow(12, 0, 0, 13.0, 0.9, 0.05, C.refW, 0.2, 250);

    drawRow(LAMP, 0, 0, 4.5, 10.0, 0.35, C.lamp, 1.0, MAXD); // street lamps on the median
  }

  // ---------------- Other cars ----------------
  const NSAME = 10, NOPP = 14;
  const cars = [];
  function spawnCar(c, initial) {
    c.brake = 0;
    if (!c.opp) {
      if (rand(99) < 45) {
        c.lane = -1.75;
        c.v = speed * (0.85 + rand(10) / 100);
        c.s = trackS + 80 + rand(450);
      } else {
        c.lane = 1.75;
        c.v = speed + 2 + rand(80) / 10;
        c.s = initial ? trackS + 20 + rand(500) : trackS - 30 - rand(150);
      }
    } else {
      c.lane = rand(1) ? 7.25 : 10.75;
      c.v = -(24 + rand(80) / 10);
      c.s = initial ? trackS + rand(MAXD) : trackS + MAXD + rand(400);
    }
  }
  for (let i = 0; i < NSAME + NOPP; i++) {
    const c = { opp: i >= NSAME };
    spawnCar(c, true);
    cars.push(c);
  }

  function updateCars(dt) {
    for (const c of cars) {
      c.s += c.v * dt;
      const d = c.s - trackS;
      if (!c.opp) {
        if (c.lane < 0 && d < 45 && c.v < speed + 1) c.v += 6 * dt;  // car ahead keeps its distance
        if (c.brake > 0) c.brake -= dt;
        else if (Math.random() < dt / 15) c.brake = 0.8 + Math.random();
        if (d > MAXD + 80 || d < -260) spawnCar(c, false);
      } else if (d < -5) {
        spawnCar(c, false);
      }
    }
  }

  function drawCars() {
    for (const c of cars) {
      const d = c.s - trackS;
      if (d < 2 || d >= MAXD) continue;
      if (!c.opp) {
        const br = c.brake > 0;
        const inten = (br ? 1.0 : 0.6) * fade(d, 650);
        const rr = br ? 0.09 : 0.07;
        for (const k of [-1, 1]) {
          if (project(d, c.lane + 0.7 * k, 0.8)) glow(P.x, P.y, rr * P.sc, C.tail, inten);
        }
        if (br && project(d, c.lane, 1.15)) glow(P.x, P.y, 0.05 * P.sc, C.tail, inten);
      } else {
        const flick = 0.75 + 0.25 * Math.sin(d * 0.9);       // flicker through the anti-glare screen
        const inten = fade(d, MAXD) * flick;
        for (const k of [-1, 1]) {
          if (project(d, c.lane + 0.7 * k, 0.65)) glow(P.x, P.y, 0.13 * P.sc, C.head, inten);
        }
        if (d < 90 && project(d, c.lane, 0.65)) glow(P.x, P.y, 1.2 * P.sc, C.head, 0.25 * (1 - d / 90));
      }
    }
  }

  // ---------------- Controls ----------------
  const keys = {};
  let paused = false;
  const kmhEl = document.getElementById('kmh');
  const hud = document.getElementById('hud');
  const pauseBtn = document.getElementById('pause');

  function togglePause() {
    paused = !paused;
    pauseBtn.textContent = paused ? '▶' : 'Ⅱ';
    pauseBtn.setAttribute('aria-label', paused ? T.resume : T.pause);
  }
  window.addEventListener('keydown', e => {
    if (e.code === 'ArrowUp' || e.code === 'ArrowDown') { keys[e.code] = true; e.preventDefault(); }
    if (e.code === 'Space') { togglePause(); e.preventDefault(); }
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });

  // +/- buttons accelerate/decelerate only while held
  function holdButton(id, code) {
    const b = document.getElementById(id);
    const on = e => { keys[code] = true; e.preventDefault(); };
    const off = () => { keys[code] = false; };
    b.addEventListener('pointerdown', on);
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => b.addEventListener(t, off));
    b.addEventListener('keydown', e => { if (e.key === 'Enter') keys[code] = true; });
    b.addEventListener('keyup', e => { if (e.key === 'Enter') keys[code] = false; });
  }
  holdButton('faster', 'ArrowUp');
  holdButton('slower', 'ArrowDown');
  pauseBtn.addEventListener('click', togglePause);

  // Konami code (↑↑↓↓←→←→BA) summons the UFO; compare the last 10 keys so extra presses don't break it
  const KONAMI = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
  const recent = [];
  window.addEventListener('keydown', e => {
    if (e.repeat) return;
    recent.push(e.key.length === 1 ? e.key.toLowerCase() : e.key);
    if (recent.length > KONAMI.length) recent.shift();
    if (recent.length === KONAMI.length && recent.every((k, i) => k === KONAMI[i])) {
      recent.length = 0;
      summonUfo();
    }
  });

  // touch alternative: tap the speedometer 10 times in a row (gaps under 1.5 s)
  let taps = 0, lastTap = 0;
  document.querySelector('.speed').addEventListener('pointerdown', e => {
    const now = performance.now();
    taps = now - lastTap < 1500 ? taps + 1 : 1;
    lastTap = now;
    if (taps >= 10) { taps = 0; summonUfo(); }
  });

  // fullscreen (hide the button where the API is unavailable, e.g. iPhone Safari)
  const fsBtn = document.getElementById('fs');
  const fsRoot = document.documentElement;
  const fsActive = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  if (!(fsRoot.requestFullscreen || fsRoot.webkitRequestFullscreen)) {
    fsBtn.style.display = 'none';
  } else {
    const toggleFullscreen = () => {
      if (fsActive()) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        try {
          const p = (fsRoot.requestFullscreen || fsRoot.webkitRequestFullscreen).call(fsRoot);
          if (p && p.catch) p.catch(() => {});
        } catch (e) {}
      }
    };
    fsBtn.addEventListener('click', toggleFullscreen);
    window.addEventListener('keydown', e => { if (e.code === 'KeyF') toggleFullscreen(); });
    // Esc also leaves fullscreen, so track the state via the change event
    ['fullscreenchange', 'webkitfullscreenchange'].forEach(t =>
      document.addEventListener(t, () => {
        fsBtn.textContent = fsActive() ? '⊡' : '⛶';
        fsBtn.setAttribute('aria-label', fsActive() ? T.fsExit : T.fs);
      }));
  }

  // switch between left- and right-hand traffic
  const driveBtn = document.getElementById('drive');
  function setDrive(leftHand) {
    sideTarget = leftHand ? 1 : -1;
    driveBtn.textContent = leftHand ? T.left : T.right;
    try { localStorage.setItem('drive-side', leftHand ? 'left' : 'right'); } catch (e) {}
  }
  driveBtn.addEventListener('click', () => setDrive(sideTarget < 0));
  window.addEventListener('keydown', e => { if (e.code === 'KeyD') setDrive(sideTarget < 0); });
  try {
    if (localStorage.getItem('drive-side') === 'right') { setDrive(false); side = -1; }
  } catch (e) {}

  let idleTimer = 0;
  function wake() { hud.classList.remove('idle'); idleTimer = 0; }
  window.addEventListener('pointermove', wake);
  window.addEventListener('keydown', wake);

  // ---------------- Main loop ----------------
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduceMotion) speed = 14;

  let prev = performance.now(), time = 0, lastKmh = -1;
  function frame(now) {
    let dt = (now - prev) / 1000; prev = now;
    if (dt > 0.05) dt = 0.05;

    if (keys.ArrowUp) speed += 8 * dt;
    if (keys.ArrowDown) speed -= 8 * dt;
    speed = Math.min(45, Math.max(8, speed));

    // ease toward the selected driving side
    side += (sideTarget - side) * Math.min(1, dt * 3);

    idleTimer += dt;
    if (idleTimer > 4) hud.classList.add('idle');

    if (!paused) {
      time += dt;
      heading += curvature(trackS) * speed * dt;
      trackS += speed * dt;
      updateCars(dt);
      updateMeteors(dt);
      updateUfo(dt);
    }
    updateRoadShape();

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#02030a';
    ctx.fillRect(0, 0, SW, SH);

    ctx.globalCompositeOperation = 'lighter';   // additive blending
    drawSkyGlow();
    drawStars(time);
    drawCity(time);
    drawMeteors();
    drawUfo();
    drawRoad();
    drawCars();

    const kmh = Math.round(speed * 3.6);
    if (kmh !== lastKmh) { kmhEl.textContent = kmh; lastKmh = kmh; }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
